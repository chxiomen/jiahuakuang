const embeddedRequirements={"requirements":{"change:c-subscription-payment":"<section class=\"requirement-section\"><h3>套餐列表</h3><p>在列表中增加两个商品，价格与顺序如下：（商品id 待定）</p><div class=\"requirements-table-wrap\"><table class=\"requirements-table\"><thead><tr class=\"editor-row-highlight\"><th>档位</th><th class=\"editor-cell-highlight\">连续包年</th><th class=\"editor-cell-highlight\">连续包月</th><th>终身会员</th><th>12个月</th><th>3个月</th><th>1个月</th></tr></thead><tbody><tr class=\"\"><td>VIP</td><td class=\"editor-cell-highlight\">¥88/年</td><td class=\"editor-cell-highlight\">¥18/月</td><td>¥198</td><td>¥88</td><td>¥68</td><td>¥18</td></tr><tr><td>SVIP</td><td class=\"editor-cell-highlight\">¥128/年</td><td class=\"editor-cell-highlight\">¥28/月</td><td>¥298</td><td>¥128</td><td>—</td><td>¥28</td></tr></tbody></table></div></section><section class=\"requirement-section\"><h3>协议文案</h3><ul class=\"requirement-list\"><li>当选中 连续商品 时，协议文案需发生以下改变：<ul class=\"requirement-list\"><li>增加勾选框，默认不勾选，但必填</li><li>未填时点击购买按钮 → 触发提示弹窗</li><li>文案非写死，其中的价格、周期需跟随选中商品动态变化</li></ul></li><li>选中单次档商品时，则维持原状</li></ul></section><section class=\"requirement-section\"><h3>下次扣款日期说明</h3><ul class=\"requirement-list\"><li>当选中 连续商品 时，须在商品列表下增加一句文案：<ul class=\"requirement-list\"><li>下次付款日期：2026 年 6 月 21 号，可随时取消。</li></ul></li><li>单次档商品不展示改文案</li><li>日期需跟随选中的商品、及当前日期来计算，规则如下：<ul class=\"requirement-list\"><li>连续包月：首次付费日期 + 1 个自然月。</li><li>连续包年：首次付费日期 + 1 个自然年。</li><li>若目标月份不存在对应日期，则取该月最后一天。</li></ul></li></ul></section><section class=\"requirement-section\"><h3>点击购买</h3><ul class=\"requirement-list\"><li>用户勾选同意，并点击购买后，进入 → 微信官方自动续费签约页</li><li>后端等待微信的购买结果通知：<ul class=\"requirement-list\"><li>用户购买成功：刷新会员状态，且用户返回小程序时，需关闭付费页，自动进入续费管理页</li><li>用户购买失败：用户停留在付费页</li></ul></li></ul></section><section class=\"requirement-section\"><h3>续费状态中</h3><p>指用户成功购买了连续商品，且未取消续费的状态，此状态下：</p><ul class=\"requirement-list\"><li>无法再进行任何购买行为</li><li>取消续费后即可叠加购买别的商品</li></ul></section>","change:c-subscription-renewal":"<section class=\"requirement-section\"><h3>页面入口</h3><ul class=\"requirement-list\"><li>点击「我的」会员卡片进入</li><li>用户成功购买连续商品并收到支付成功通知后，返回小程序时自动进入</li></ul></section><section class=\"requirement-section\"><h3>会员卡片</h3><ul class=\"requirement-list\"><li>展示当前会员昵称</li><li>展示会员类型和当前订阅商品，例如：VIP会员 · 连续包月</li><li>展示用户ID</li></ul></section><section class=\"requirement-section\"><h3>下次扣费信息</h3><ul class=\"requirement-list\"><li>展示下次续费时间、下次续费金额</li><li>需与用户实际购买的连续商品保持一致</li><li>连续包月：下次扣费时间为首次付费日期 + 1个自然月</li><li>连续包年：下次扣费时间为首次付费日期 + 1个自然年</li><li>若目标月份不存在对应日期，则取该月最后一天</li></ul></section><section class=\"requirement-section\"><h3>服务承诺</h3><ul class=\"requirement-list\"><li>展示安全无忧：扣费前发送扣费通知</li><li>展示扣费透明：用户可以查询扣费记录</li><li>展示随时取消：用户可以按照指引取消自动续费</li></ul></section><section class=\"requirement-section\"><h3>扣费记录</h3><ul class=\"requirement-list\"><li>按时间倒序展示历史扣费记录</li><li>每条记录展示订阅商品名称，例如：VIP连续包月</li><li>展示本次扣费金额</li><li>展示本次订阅对应的有效期起止时间</li><li>扣费记录以服务端实际支付结果为准，不能仅根据客户端展示生成</li></ul></section><section class=\"requirement-section\"><h3>取消续费</h3><ul class=\"requirement-list\"><li>页面需要明确告知用户：取消自动续费需要前往微信操作</li><li>展示取消路径：微信 → 我 → 服务 → 钱包 → 支付设置 → 自动续费</li><li>用户取消成功后，不再产生下一次自动扣费，但当前已购买的会员权益仍可使用至有效期结束</li><li>用户取消自动续费后，可以重新进入付费页购买其他商品</li></ul></section><section class=\"requirement-section\"><h3>续费状态展示</h3><ul class=\"requirement-list\"><li>正常续费中：展示当前会员、订阅商品、下次续费时间和金额，并提供取消续费指引</li><li>已取消续费但权益仍有效：展示已取消自动续费状态、会员权益到期时间，并明确不会再次扣费</li><li>已取消续费但权益仍有效时，用户仍可正常使用会员权益</li><li>会员已到期：展示权益已结束提示，不展示下次扣费信息，并提供立即续费入口</li><li>自动续费状态下不提供重复进入付费页购买的入口；取消后可以重新购买其他商品</li></ul></section><section class=\"requirement-section\"><h3>状态变更与数据来源</h3><ul class=\"requirement-list\"><li>取消续费成功后，服务端更新自动续费状态，客户端返回小程序时刷新会员状态</li><li>客户端不得仅根据用户点击取消按钮就判定取消成功，必须等待服务端或微信支付结果确认</li><li>续费状态、权益到期时间、下次扣费时间和金额均以服务端数据为准</li><li>会员中心、我的页面和续费管理页的状态需要保持一致</li></ul></section><section class=\"requirement-section\"><h3>使用问题与客服</h3><ul class=\"requirement-list\"><li>页面提供售后客服入口</li><li>用户遇到使用体验、退款或扣费问题时，可以联系客服</li><li>客服处理时需要能够关联用户ID、订阅商品、扣费金额和扣费时间</li></ul></section><section class=\"requirement-section\"><h3>支付结果与异常状态</h3><ul class=\"requirement-list\"><li>支付成功：刷新会员状态，并在用户返回小程序时关闭付费页，自动进入续费管理页</li><li>支付失败：用户停留在付费页，不进入续费管理页</li><li>自动续费扣款失败：保留当前扣款结果和失败提示，并引导用户联系客服或重新购买</li><li>续费管理页展示的信息以服务端会员状态和支付回调结果为准</li></ul></section>","change:c-subscription-renewal:active":"<section class=\"requirement-section\"><h3>会员卡片</h3><ul class=\"requirement-list\"><li>用户昵称</li><li>会员类型 · 商品名</li><li>用户 ID</li></ul></section><section class=\"requirement-section\"><h3>下次扣费信息</h3><ul class=\"requirement-list\"><li>展示下次续费时间和金额</li><li>下次付款时间计算规则：</li><ul><li>以服务端确认的首笔连续商品支付成功时间为基准计算</li><li>连续包月：基准时间加 1 个自然月</li><li>连续包年：基准时间加 1 个自然年<br></li><li>如果目标月份没有对应日期，则取目标月份最后一天</li></ul></ul></section><section class=\"requirement-section\"><h3>续费开关</h3><ul class=\"requirement-list\"><li>默认展示为开启状态。</li><li>用户点击开关后，弹出“关闭自动续费”确认弹窗。</li><li>用户点击确认后：</li><ul><li>前端向服务端发起请求</li><li>服务端掉用微信解除代扣签约协议接口</li><li>等待微信发送的结果通知</li><ul><li>解约成功时：刷新用户状态及页面为：已取消但权益有效</li><li>解约失败、协议不存在或状态同步延迟时，保持原状态并提示用户操作失败</li></ul></ul></ul></section>","change:c-subscription-renewal:common":"<section class=\"requirement-section\"><h3>页面入口</h3><ul class=\"requirement-list\"><li>点击「我的」会员卡片进入</li></ul></section><section class=\"requirement-section\"><h3>服务承诺</h3><ul class=\"requirement-list\"><li>纯展示，仅需复刻 UI</li></ul></section><section class=\"requirement-section\"><h3>扣费记录</h3><ul class=\"requirement-list\"><li>按时间倒序展示记录</li><ul><li>标题：会员类型 · 商品名</li><li>副标题：对应订阅的日期起止时间</li><li>右侧：实际扣费金额</li></ul><li>扣费记录以服务端实际支付结果为准</li></ul></section><section class=\"requirement-section\"><h3>底部操作入口</h3><ul class=\"requirement-list\"><li>页面底部固定悬浮展示三个文本按钮：续费协议、取消续费、申请退款</li><li>点击后，都是从底部拉起弹窗，内容分别为：<br></li><ul><li>自动续费协议</li><li>取消续费引导</li><li>申请图款引导</li></ul></ul></section>","release:v7.5.6":"<section><h3>需求大纲：</h3><ol><li>将原 <strong>微信支付委托代扣</strong>，更新为接入 <strong>微信虚拟支付</strong>；</li><li>在 <span style=\"color: rgb(32, 38, 49); font-weight: 700;\">付费页</span> 新增 <span style=\"color: rgb(32, 38, 49); font-weight: 700;\">自动续费</span> 的订阅项目；</li><li>新增 <strong>续费管理页</strong>，以便用户追踪订阅状态；</li></ol></section><section><h3>终端：</h3><p>仅限于 <strong>安卓</strong>/<strong>鸿蒙</strong> 系统的小程序</p></section>","change:c-subscription-renewal:canceled":"<section class=\"requirement-section\"><h3>会员卡片</h3><ul class=\"requirement-list\"><li>用户昵称</li><li>会员类型 · 已取消自动续费</li><li>用户 ID</li></ul></section><section class=\"requirement-section\"><h3>权益到期信息</h3><ul class=\"requirement-list\"><li>会员状态：已取消自动续费</li><li>权益到期：计算规则如下：</li><ul><li>以服务端返回的当前有效权益到期时间为准</li><li style=\"margin: 0px 0px 7px; padding-left: 2px;\">权益到期时间以最近一次已支付成功并生效的会员商品为计算基础</li></ul></ul></section><section class=\"requirement-section\"><h3>续费开关</h3><ul class=\"requirement-list\"><li>默认展示为关闭状态，文案为“自动续费”</li><li>用户点击开关后，跳转至付费页</li></ul></section>","change:c-subscription-renewal:expired":"<section class=\"requirement-section\"><h3>续费开关</h3><ul class=\"requirement-list\"><li>默认展示为关闭状态，文案为“再次续费”。</li><li>用户点击开关后，跳转至付费页。</li><li>用户完成新的会员商品购买后，重新建立对应的会员状态。</li></ul></section>","change:c-virtual-payment":"<section class=\"requirement-section\"><h3>支付方式更新</h3><p>将目前的<strong>微信支付委托代扣</strong>更改为接入<strong>微信小程序虚拟支付</strong>。</p><ul class=\"requirement-list\"><li>移除原委托代扣的支付链路，后续由服务端创建虚拟支付订单并调用微信虚拟支付能力。</li><li>具体接入规则、接口参数和限制以<a href=\"https://developers.weixin.qq.com/miniprogram/dev/platform-capabilities/business-capabilities/vips.html\" target=\"_blank\" rel=\"noopener noreferrer\">微信小程序虚拟支付官方文档</a>为准。</li><li>可同时参考<a href=\"https://pay.wechatpay.cn/doc/v3/merchant/4012286301\" target=\"_blank\" rel=\"noopener noreferrer\">微信支付官方签约流程文档</a>，确认支付、签约和结果返回的处理方式。</li></ul></section><section class=\"requirement-section\"><h3>前端表现</h3><ol class=\"requirement-list\"><li>页面继续保留商品选择和购买入口，但购买行为改为发起微信虚拟支付。</li><li>前端流程简单展示为：选择商品 → 点击购买 → 拉起微信虚拟支付/签约界面 → 用户确认 → 返回小程序 → 展示支付结果。</li><li>用户完成微信页面操作后，前端根据服务端最终订单结果展示“支付成功”“支付失败”或“处理中”，不能只根据客户端回调直接判定权益已生效。</li></ol><figure class=\"requirements-figure\"><img src=\"assets/virtual-payment-signing.png\" alt=\"微信官方虚拟支付开通及签约示例界面\"><figcaption>微信官方示例图：虚拟支付签约流程 <a href=\"https://developers.weixin.qq.com/miniprogram/dev/platform-capabilities/business-capabilities/vips.html\" target=\"_blank\" rel=\"noopener noreferrer\">参考官方文档</a></figcaption></figure></section>"},"updatedAt":"2026-10-09T21:33:43.110Z"};

const hoverZone=document.querySelector('.device-hover-zone'); let toolIdleTimer=null;
function clearToolIdleTimer(){if(toolIdleTimer){clearTimeout(toolIdleTimer);toolIdleTimer=null}}
function showToolsForHover(){clearToolIdleTimer();hoverZone.classList.add('tools-visible');toolIdleTimer=setTimeout(()=>{hoverZone.classList.remove('tools-visible');toolIdleTimer=null},2000)}

function page(){return data.pages.find(x=>x.id===state.pageId)} function pageState(){return page().states.find(x=>x.id===state.stateId)} function release(id){return data.releases.find(x=>x.id===id)} function label(){return `${page().name} / ${pageState().name}`} function platform(){return platformNames[state.platform]}
function annotation(target){return data.annotations.find(a=>a.pageId===state.pageId&&a.targetId===target&&(a.stateIds==='all'||a.stateIds.includes(state.stateId)))||data.annotations.find(a=>a.targetId===target)}
function typeName(type){return ({add:'新增',edit:'修改',remove:'删除'})[type]||''}
function changeTag(change){return change.tag||typeName(change.type)}
function changeClass(change){return change.type||({新增:'add',修改:'edit',删除:'remove'}[change.tag]||'tag')}
function inlineMarkdown(text){return escape(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function renderTree(){ $('#treeSwitch').textContent=state.tree==='release'?'版本树':'页面树'; $('#tree').innerHTML=state.tree==='release'?releaseTree():pageTree(); bindTree() }
function releaseTree(){return `<h3 class="tree-title">版本迭代</h3>${data.releases.map(r=>{const folded=state.folded.has(r.id),chosen=state.selectedRelease===r.id;return `<article class="release ${folded?'folded':''}"><div class="release-line"><button class="release-fold" data-fold-release="${r.id}" aria-label="${folded?'展开':'收起'}版本"><i class="chevron" aria-hidden="true"></i></button><button class="release-header ${chosen?'selected':''}" data-release="${r.id}"><span><b>${r.id} · ${r.name}</b></span><em></em></button></div><div class="release-content">${r.changes.map(c=>`<button class="change-item ${state.selectedChange===c.id?'active':''}" data-change="${c.id}" data-parent-release="${r.id}"><span><b>${c.title||`${findPage(c.pageId).name} / ${findState(c.pageId,c.stateId).name}`}</b>${c.description?`<small>${c.description}</small>`:''}</span>${changeTag(c)?`<span class="change-type ${changeClass(c)}">${changeTag(c)}</span>`:''}</button>`).join('')}</div></article>`}).join('')}`}
function pageTree(){const groups=[...new Set(data.pages.map(p=>p.group))];return groups.map(g=>`<section class="page-group"><h3>${g}</h3>${data.pages.filter(p=>p.group===g).map(p=>`<button class="page-node" data-page="${p.id}" data-first-state="${p.states[0].id}"><i class="dot"></i>${p.name}</button>`).join('')}</section>`).join('')}
function bindTree(){document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>showReleaseNote(b.dataset.release));document.querySelectorAll('[data-fold-release]').forEach(b=>b.onclick=()=>toggleReleaseFold(b.dataset.foldRelease));document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>selectChange(b.dataset.parentRelease,b.dataset.change));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>selectPage(b.dataset.page,b.dataset.state||b.dataset.firstState))}
function toggleReleaseFold(id){state.folded.has(id)?state.folded.delete(id):state.folded.add(id);renderTree()}
function selectChange(releaseId,changeId){const c=release(releaseId).changes.find(x=>x.id===changeId);state.selectedRelease=releaseId;state.selectedChange=changeId;if(c.pageId&&c.stateId){state.pageId=c.pageId;state.stateId=c.stateId}state.noteMode='change';state.activeAnnotation=null;renderAll()}
function selectPage(pageId,stateId){state.pageId=pageId;state.stateId=stateId;state.selectedChange=null;state.noteMode='page';state.activeAnnotation=null;renderAll()}
const renderToolsDefault=renderTools;renderTools=function(){if(state.pageId!=='mine'){renderToolsDefault();return}$('#deviceTools').innerHTML=`<div class="crumb">${label()}</div><div class="tool-row"><div class="segment">${Object.entries(platformNames).map(([id,name])=>`<button class="${state.platform===id?'on':''}" data-platform="${id}">${name}</button>`).join('')}</div></div>`;document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{state.platform=b.dataset.platform;renderAll()})}
function findPage(id){return data.pages.find(p=>p.id===id)} function findState(pageId,id){return findPage(pageId).states.find(s=>s.id===id)}
function renderTools(){const states=page().states;$('#deviceTools').innerHTML=`<div class="crumb">${label()}</div><div class="tool-row"><div class="segment">${Object.entries(platformNames).map(([id,name])=>`<button class="${state.platform===id?'on':''}" data-platform="${id}">${name}</button>`).join('')}</div><div class="segment">${states.map(s=>`<button class="${state.stateId===s.id?'on':''}" data-tool-state="${s.id}">${s.name}</button>`).join('')}</div></div>`;document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{state.platform=b.dataset.platform;renderAll()});document.querySelectorAll('[data-tool-state]').forEach(b=>b.onclick=()=>selectPage(state.pageId,b.dataset.toolState))}

function showReleaseNote(id){state.noteMode='release';state.activeAnnotation=null;state.selectedRelease=id;syncWorkspaceMode();renderPhone();renderNotes()}
function isRecurringPlan(){return state.paymentPlan==='annual'||state.paymentPlan==='monthly'}

function closeSheet(){clearTextSelection();document.querySelector('.sheet-actions')?.classList.remove('single');state.sheetAction=null;$('#mask').classList.remove('show');$('#sheet').classList.remove('show')}
function confirmAction(){if(state.sheetAction==='renewal-cancel'){state.stateId='canceled';state.noteMode='page';state.activeAnnotation=null;showToast('已关闭自动续费')}else if(state.sheetAction==='join'&&state.platform!=='ios'){state.stateId='member';state.noteMode='page';state.activeAnnotation=null;showToast('已开通会员（原型模拟）')}else if(state.sheetAction==='payment-submit'){showToast(state.platform==='ios'?'已展示客服开通说明':'已提交支付确认（原型模拟）')}else if(state.sheetAction==='core'||state.sheetAction==='entry'){showToast('操作成功（原型模拟）')}closeSheet();renderAll()}

function normalizeRenewalCommonRequirements(){const commonKey='change:c-subscription-renewal:common';const legacyKey='change:c-subscription-renewal';if(!savedRequirements[commonKey]&&!savedRequirements[legacyKey])return;const common=document.createElement('div');common.innerHTML=savedRequirements[commonKey]||savedRequirements[legacyKey];common.querySelectorAll('.requirement-section').forEach(section=>{const title=section.querySelector('h3')?.textContent?.trim();if(title==='会员卡片'||title==='下次扣费信息'||title==='状态说明')section.remove()});if(!common.innerHTML.includes('底部操作入口'))common.insertAdjacentHTML('beforeend','<section class="requirement-section"><h3>底部操作入口</h3><ul class="requirement-list"><li>页面底部展示三个文本按钮：自动续费协议、取消续费、申请退款。</li><li>点击“自动续费协议”，弹窗展示自动续费协议内容。</li><li>点击“取消续费”，弹窗展示两种取消方式：前往微信支付的自动续费页面关闭，或点击页面上方的自动续费开关关闭。</li><li>点击“申请退款”，弹窗提示用户联系客服，由客服协助核实订单并处理退款。</li></ul></section>');const html=common.innerHTML;if(savedRequirements[commonKey]!==html){savedRequirements[commonKey]=html;fetch('/api/requirements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:commonKey,html})}).catch(()=>{})}}
