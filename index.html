function annotation(target){return data.annotations.find(a=>a.pageId===state.pageId&&a.targetId===target&&(a.stateIds==='all'||a.stateIds.includes(state.stateId)))||data.annotations.find(a=>a.targetId===target)}
function typeName(type){return ({add:'新增',edit:'修改',remove:'删除'})[type]||''}
function changeTag(change){return change.tag||typeName(change.type)}
function changeClass(change){return change.type||({新增:'add',修改:'edit',删除:'remove'}[change.tag]||'tag')}
function inlineMarkdown(text){return escape(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function renderTree(){ $('#treeSwitch').textContent=state.tree==='release'?'版本树':'页面树'; $('#tree').innerHTML=state.tree==='release'?releaseTree():pageTree(); bindTree() }
function releaseTree(){return `<h3 class="tree-title">版本迭代</h3>${data.releases.map(r=>{const folded=state.folded.has(r.id),chosen=state.selectedRelease===r.id;return `<article class="release ${folded?'folded':''}"><div class="release-line"><button class="release-fold" data-fold-release="${r.id}" aria-label="${folded?'展开':'收起'}版本"><i class="chevron" aria-hidden="true"></i></button><button class="release-header ${chosen?'selected':''}" data-release="${r.id}"><span><b>${r.id} · ${r.name}</b></span><em></em></button></div><div class="release-content">${r.changes.map(c=>`<button class="change-item ${state.selectedChange===c.id?'active':''}" data-change="${c.id}" data-parent-release="${r.id}"><span><b>${c.title||`${findPage(c.pageId).name} / ${findState(c.pageId,c.stateId).name}`}</b>${c.description?`<small>${c.description}</small>`:''}</span>${changeTag(c)?`<span class="change-type ${changeClass(c)}">${changeTag(c)}</span>`:''}</button>`).join('')}</div></article>`}).join('')}`}
function pageTree(){const groups=[...new Set(data.pages.map(p=>p.group))];return groups.map(g=>`<section class="page-group"><h3>${g}</h3>${data.pages.filter(p=>p.group===g).map(p=>`<button class="page-node" data-page="${p.id}" data-first-state="${p.states[0].id}"><i class="dot"></i>${p.name}</button>`).join('')}</section>`).join('')}
function bindTree(){document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>showReleaseNote(b.dataset.release));document.querySelectorAll('[data-fold-release]').forEach(b=>b.onclick=()=>toggleReleaseFold(b.dataset.foldRelease));document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>selectChange(b.dataset.parentRelease,b.dataset.change));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>selectPage(b.dataset.page,b.dataset.state||b.dataset.firstState))}
function toggleReleaseFold(id){state.folded.has(id)?state.folded.delete(id):state.folded.add(id);renderTree()}
function selectChange(releaseId,changeId){const c=release(releaseId).changes.find(x=>x.id===changeId);state.selectedRelease=releaseId;state.selectedChange=changeId;if(c.pageId&&c.stateId){state.pageId=c.pageId;state.stateId=c.stateId}state.noteMode='change';state.activeAnnotation=null;renderAll()}
function selectPage(pageId,stateId){state.pageId=pageId;state.stateId=stateId;state.selectedChange=null;state.noteMode='page';state.activeAnnotation=null;renderAll()}
function findPage(id){return data.pages.find(p=>p.id===id)} function findState(pageId,id){return findPage(pageId).states.find(s=>s.id===id)}
function renderTools(){const states=page().states;$('#deviceTools').innerHTML=`<div class="crumb">${label()}</div><div class="tool-row"><div class="segment">${Object.entries(platformNames).map(([id,name])=>`<button class="${state.platform===id?'on':''}" data-platform="${id}">${name}</button>`).join('')}</div><div class="segment">${states.map(s=>`<button class="${state.stateId===s.id?'on':''}" data-tool-state="${s.id}">${s.name}</button>`).join('')}</div></div>`;document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{state.platform=b.dataset.platform;renderAll()});document.querySelectorAll('[data-tool-state]').forEach(b=>b.onclick=()=>selectPage(state.pageId,b.dataset.toolState))}

function screenHtml(){if(state.pageId==='home'&&state.stateId==='empty')return `<div class="mobile-title"><h1>应用名称</h1><i class="avatar"></i></div><div class="search">⌕　搜索内容或功能</div><div class="empty-state"><section><div class="empty-art"></div><b>暂时没有内容</b><p>这是首页空态，用于演示状态切换。</p><button data-target="core">刷新内容</button></section></div>`;if(state.pageId==='home')return `<div class="mobile-title"><h1>应用名称</h1><i class="avatar"></i></div><div class="search">⌕　搜索内容或功能</div><section class="app-hero"><small>通用主视觉区</small><h2>一句清晰的页面主张</h2><p>用于承接本期最重要的用户目标。</p><button class="phone-action" data-target="core">开始操作</button></section><div class="section-title"><b>常用功能</b><span>查看全部 ›</span></div><div class="quick-grid"><button class="quick-card" data-target="entry"><i class="fake-icon"></i><b>功能入口 A</b><small>说明文字</small></button><button class="quick-card" data-target="entry"><i class="fake-icon"></i><b>功能入口 B</b><small>说明文字</small></button></div><div class="section-title"><b>推荐内容</b></div><div class="list">${['一条可点击的列表项','另一条通用列表项'].map(t=>`<button class="list-row" data-target="list"><i class="fake-icon"></i><span><b>${t}</b><small>标题、辅助信息与详情入口</small></span><em class="arrow">›</em></button>`).join('')}</div>`;if(state.pageId==='payment')return paymentHtml();if(state.pageId==='renewal')return renewalHtml();if(state.pageId==='member'){const info=state.stateId==='member'?['会员有效','你的会员权益正在生效','可使用专属功能与会员服务。','管理会员','manage']:state.stateId==='expired'?['会员已过期','续费后继续使用会员权益','过期后，部分会员功能将不可用。','立即续费','join']:['当前为非会员','解锁更多专属权益','开通后可体验完整会员服务。','立即开通','join'];const cta=state.platform==='ios'&&info[4]==='join'?'联系客服':info[3];return `<div class="mobile-title"><h1>会员中心</h1><i class="avatar"></i></div><section class="member-card"><span class="tag">${info[0]}</span><h2>${info[1]}</h2><p>${info[2]}</p><button class="phone-action" data-target="${info[4]}">${cta}</button></section><div class="section-title"><b>会员权益</b><span>查看全部 ›</span></div><div class="list">${['权益一','权益二'].map(t=>`<button class="list-row" data-target="manage"><i class="fake-icon"></i><span><b>${t}</b><small>会员可使用的通用能力</small></span><em class="arrow">›</em></button>`).join('')}</div><div class="section-title" style="margin-top:22px"><b>当前状态</b></div><section class="app-hero"><small>切换示例</small><h2>${pageState().name}</h2><p>使用设备上方状态切换，查看不同界面和不同规则。</p></section>`}return `<div class="mobile-title"><h1>我的</h1><i class="avatar"></i></div><section class="app-hero"><small>用户信息区</small><h2>你好，用户</h2><p>用于承接账户概览与身份信息。</p></section><div class="section-title"><b>账户服务</b></div><div class="service-list">${['设置','帮助与反馈'].map(t=>`<button class="list-row" data-target="service"><i class="fake-icon"></i><span><b>${t}</b><small>${t==='设置'?'通知、隐私与通用设置':'问题反馈和服务支持'}</small></span><em class="arrow">›</em></button>`).join('')}</div>`}

function scopeTags(extra=[]){return [platform(),pageState().name,...extra].map(x=>`<span>${escape(x)}</span>`).join('')}

function annotationNote(a){return `<div class="note-context"><small>当前操作</small><b>${a.title} · ${platform()}</b></div><div class="label">元素交互说明</div><article class="action-note"><h3>${a.title}</h3><div class="field"><b>展示规则</b><p>${a.displayRule}</p></div><div class="field"><b>点击行为</b><p>${a.action}</p></div><div class="field"><b>交互结果</b><p>${a.result}</p></div><div class="field"><b>适用范围</b><p>${platform()} · ${pageState().name}</p></div></article><button class="return" id="returnNote">← 返回页面完整说明</button>`}
function requirementList(items,ordered=false){const tag=ordered?'ol':'ul';return `<${tag} class="requirement-list">${items.map(item=>{const entry=typeof item==='string'?{text:item}:item;return `<li>${inlineMarkdown(entry.text)}${entry.children?requirementList(entry.children):''}</li>`}).join('')}</${tag}>`}

function releaseNote(id){const r=release(id),req=r.requirements;if(req)return requirementsNote(req);return `<div class="note-context"><small>当前版本</small><b>${r.id} · ${r.name}</b></div><div class="label">版本迭代说明</div><article class="release-summary"><h3>${r.name}</h3>${r.goal?`<p>${r.goal}</p>`:''}<ul>${r.changes.length?r.changes.map(c=>`<li>${changeTag(c)?`${changeTag(c)}：`:''}${c.title||`${findPage(c.pageId).name} / ${findState(c.pageId,c.stateId).name}`}${c.description?` · ${c.description}`:''}</li>`).join(''):'<li>尚无目录项。</li>'}</ul></article><div class="label">查看方式</div><div class="copy">展开一个版本后，点击其中的目录项，即可查看当期的页面预览、交互说明和改动范围。</div>`}

function renderNotes(){let html=state.noteMode==='release'?releaseNote(state.selectedRelease):state.noteMode==='change'?changeNote():state.noteMode==='annotation'?annotationNote(state.activeAnnotation):pageNote();$('#notes').innerHTML=html;$('#returnNote')?.addEventListener('click',()=>{state.noteMode='page';state.activeAnnotation=null;renderNotes()})}

function showReleaseNote(id){state.noteMode='release';state.activeAnnotation=null;state.selectedRelease=id;syncWorkspaceMode();renderPhone();renderNotes()}
function openAction(target){if(target==='join'&&state.platform!=='ios'){state.pageId='payment';state.stateId='default';state.noteMode='page';state.activeAnnotation=null;renderAll();return}const a=annotation(target);if(!a)return;state.noteMode='annotation';state.activeAnnotation=a;renderNotes();state.sheetAction=target;$('#sheetTitle').textContent=a.title;$('#sheetText').textContent=a.action;$('#mask').classList.add('show');$('#sheet').classList.add('show')}

function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function renderAll(){syncWorkspaceMode();renderTree();renderTools();renderPhone();renderNotes()}
$('#treeSwitch').onclick=()=>{state.tree=state.tree==='release'?'page':'release';state.selectedChange=null;state.noteMode='page';state.activeAnnotation=null;renderAll()};$('#fullNote').onclick=()=>{state.noteMode='page';state.activeAnnotation=null;state.selectedChange=null;renderAll()};$('#cancel').onclick=closeSheet;$('#mask').onclick=closeSheet;$('#confirm').onclick=confirmAction;renderAll();
</script>
