const embeddedRequirements={"requirements":{"change:c-subscription-payment":"<section class=\"requirement-section\"><h3>套餐列表</h3><p>在列表中增加两个商品，价格与顺序如下：（商品id 待定）</p><div class=\"requirements-table-wrap\"><table class=\"requirements-table\"><thead><tr class=\"editor-row-highlight\"><th>档位</th><th class=\"editor-cell-highlight\">连续包年</th><th class=\"editor-cell-highlight\">连续包月</th><th>终身会员</th><th>12个月</th><th>3个月</th><th>1个月</th></tr></thead><tbody><tr class=\"\"><td>VIP</td><td class=\"editor-cell-highlight\">¥88/年</td><td class=\"editor-cell-highlight\">¥18/月</td><td>¥198</td><td>¥88</td><td>¥68</td><td>¥18</td></tr><tr><td>SVIP</td><td class=\"editor-cell-highlight\">¥128/年</td><td class=\"editor-cell-highlight\">¥28/月</td><td>¥298</td><td>¥128</td><td>—</td><td>¥28</td></tr></tbody></table></div></section><section class=\"requirement-section\"><h3>协议文案</h3><ul class=\"requirement-list\"><li>当选中 连续商品 时，协议文案需发生以下改变：<ul class=\"requirement-list\"><li>增加勾选框，默认不勾选，但必填</li><li>未勾选协议点击购买时，从底部弹出当前商品的会员服务协议正文；协议区可滚动，底部固定主按钮「已阅读并同意开通」，右上角可关闭。</li><li>点击主按钮视为同意当前商品协议，并继续该商品支付流程；关闭弹窗则保持未勾选且不发起支付。</li><li>协议标题、会员等级、商品名称、首次价格、续费周期、续费金额和预计下次扣款日期均跟随当前选中商品变化；切换商品后需重新同意。</li><li>文案非写死，其中的价格、周期需跟随选中商品动态变化</li></ul></li><li>选中单次档商品时，则维持原状</li></ul></section><section class=\"requirement-section\"><h3>下次扣款日期说明</h3><ul class=\"requirement-list\"><li>当选中 连续商品 时，须在商品列表下增加一句文案：<ul class=\"requirement-list\"><li>下次付款日期：2026 年 6 月 21 号，可随时取消。</li></ul></li><li>单次档商品不展示改文案</li><li>日期需跟随选中的商品、及当前日期来计算，规则如下：<ul class=\"requirement-list\"><li>连续包月：首次付费日期 + 1 个自然月。</li><li>连续包年：首次付费日期 + 1 个自然年。</li><li>若目标月份不存在对应日期，则取该月最后一天。</li></ul></li></ul></section><section class=\"requirement-section\"><h3>点击购买</h3><ul class=\"requirement-list\"><li>用户勾选同意，并点击购买后，进入 → 微信官方自动续费签约页</li><li>后端等待微信的购买结果通知：<ul class=\"requirement-list\"><li>用户购买成功：刷新会员状态，且用户返回小程序时，需关闭付费页，自动进入续费管理页</li><li>用户购买失败：用户停留在付费页</li></ul></li></ul></section><section class=\"requirement-section\"><h3>续费状态中</h3><p>指用户成功购买了连续商品，且未取消续费的状态，此状态下：</p><ul class=\"requirement-list\"><li>无法再进行任何购买行为</li><li>取消续费后即可叠加购买别的商品</li></ul></section>","change:c-subscription-renewal":"<section class=\"requirement-section\"><h3>页面入口</h3><ul class=\"requirement-list\"><li>点击「我的」会员卡片进入</li><li>用户成功购买连续商品并收到支付成功通知后，返回小程序时自动进入</li></ul></section><section class=\"requirement-section\"><h3>会员卡片</h3><ul class=\"requirement-list\"><li>展示当前会员昵称</li><li>展示会员类型和当前订阅商品，例如：VIP会员 · 连续包月</li><li>展示用户ID</li></ul></section><section class=\"requirement-section\"><h3>下次扣费信息</h3><ul class=\"requirement-list\"><li>展示下次续费时间、下次续费金额</li><li>需与用户实际购买的连续商品保持一致</li><li>连续包月：下次扣费时间为首次付费日期 + 1个自然月</li><li>连续包年：下次扣费时间为首次付费日期 + 1个自然年</li><li>若目标月份不存在对应日期，则取该月最后一天</li></ul></section><section class=\"requirement-section\"><h3>服务承诺</h3><ul class=\"requirement-list\"><li>展示安全无忧：扣费前发送扣费通知</li><li>展示扣费透明：用户可以查询扣费记录</li><li>展示随时取消：用户可以按照指引取消自动续费</li></ul></section><section class=\"requirement-section\"><h3>扣费记录</h3><ul class=\"requirement-list\"><li>按时间倒序展示历史扣费记录</li><li>每条记录展示订阅商品名称，例如：VIP连续包月</li><li>展示本次扣费金额</li><li>展示本次订阅对应的有效期起止时间</li><li>扣费记录以服务端实际支付结果为准，不能仅根据客户端展示生成</li></ul></section><section class=\"requirement-section\"><h3>取消续费</h3><ul class=\"requirement-list\"><li>页面需要明确告知用户：取消自动续费需要前往微信操作</li><li>展示取消路径：微信 → 我 → 服务 → 钱包 → 支付设置 → 自动续费</li><li>用户取消成功后，不再产生下一次自动扣费，但当前已购买的会员权益仍可使用至有效期结束</li><li>用户取消自动续费后，可以重新进入付费页购买其他商品</li></ul></section><section class=\"requirement-section\"><h3>续费状态展示</h3><ul class=\"requirement-list\"><li>正常续费中：展示当前会员、订阅商品、下次续费时间和金额，并提供取消续费指引</li><li>已取消续费但权益仍有效：展示已取消自动续费状态、会员权益到期时间，并明确不会再次扣费</li><li>已取消续费但权益仍有效时，用户仍可正常使用会员权益</li><li>会员已到期：展示权益已结束提示，不展示下次扣费信息，并提供立即续费入口</li><li>自动续费状态下不提供重复进入付费页购买的入口；取消后可以重新购买其他商品</li></ul></section><section class=\"requirement-section\"><h3>状态变更与数据来源</h3><ul class=\"requirement-list\"><li>取消续费成功后，服务端更新自动续费状态，客户端返回小程序时刷新会员状态</li><li>客户端不得仅根据用户点击取消按钮就判定取消成功，必须等待服务端或微信支付结果确认</li><li>续费状态、权益到期时间、下次扣费时间和金额均以服务端数据为准</li><li>会员中心、我的页面和续费管理页的状态需要保持一致</li></ul></section><section class=\"requirement-section\"><h3>使用问题与客服</h3><ul class=\"requirement-list\"><li>页面提供售后客服入口</li><li>用户遇到使用体验、退款或扣费问题时，可以联系客服</li><li>客服处理时需要能够关联用户ID、订阅商品、扣费金额和扣费时间</li></ul></section><section class=\"requirement-section\"><h3>支付结果与异常状态</h3><ul class=\"requirement-list\"><li>支付成功：刷新会员状态，并在用户返回小程序时关闭付费页，自动进入续费管理页</li><li>支付失败：用户停留在付费页，不进入续费管理页</li><li>自动续费扣款失败：保留当前扣款结果和失败提示，并引导用户联系客服或重新购买</li><li>续费管理页展示的信息以服务端会员状态和支付回调结果为准</li></ul></section>","change:c-subscription-renewal:active":"<section class=\"requirement-section\"><h3>会员卡片</h3><ul class=\"requirement-list\"><li>用户昵称</li><li>会员类型 · 商品名</li><li>用户 ID</li></ul></section><section class=\"requirement-section\"><h3>下次扣费信息</h3><ul class=\"requirement-list\"><li>展示下次续费时间和金额</li><li>下次付款时间计算规则：</li><ul><li>以服务端确认的首笔连续商品支付成功时间为基准计算</li><li>连续包月：基准时间加 1 个自然月</li><li>连续包年：基准时间加 1 个自然年<br></li><li>如果目标月份没有对应日期，则取目标月份最后一天</li></ul></ul></section><section class=\"requirement-section\"><h3>续费开关</h3><ul class=\"requirement-list\"><li>默认展示为开启状态。</li><li>用户点击开关后，弹出“关闭自动续费”确认弹窗。</li><li>用户点击确认后：</li><ul><li>前端向服务端发起请求</li><li>服务端掉用微信解除代扣签约协议接口</li><li>等待微信发送的结果通知</li><ul><li>解约成功时：刷新用户状态及页面为：已取消但权益有效</li><li>解约失败、协议不存在或状态同步延迟时，保持原状态并提示用户操作失败</li></ul></ul></ul></section>","change:c-subscription-renewal:common":"<section class=\"requirement-section\"><h3>页面入口</h3><ul class=\"requirement-list\"><li>点击「我的」会员卡片进入</li></ul></section><section class=\"requirement-section\"><h3>服务承诺</h3><ul class=\"requirement-list\"><li>纯展示，仅需复刻 UI</li></ul></section><section class=\"requirement-section\"><h3>扣费记录</h3><ul class=\"requirement-list\"><li>按时间倒序展示记录</li><ul><li>标题：会员类型 · 商品名</li><li>副标题：对应订阅的日期起止时间</li><li>右侧：实际扣费金额</li></ul><li>扣费记录以服务端实际支付结果为准</li></ul></section><section class=\"requirement-section\"><h3>底部操作入口</h3><ul class=\"requirement-list\"><li>页面底部固定悬浮展示三个文本按钮：续费协议、取消续费、申请退款</li><li>点击后，都是从底部拉起弹窗，内容分别为：<br></li><ul><li>自动续费协议</li><li>取消续费引导</li><li>申请图款引导</li></ul></ul></section>","release:v7.5.6":"<section><h3>需求大纲：</h3><ol><li>将原 <strong>微信支付委托代扣</strong>，更新为接入 <strong>微信虚拟支付</strong>；</li><li>在 <span style=\"color: rgb(32, 38, 49); font-weight: 700;\">付费页</span> 新增 <span style=\"color: rgb(32, 38, 49); font-weight: 700;\">自动续费</span> 的订阅项目；</li><li>新增 <strong>续费管理页</strong>，以便用户追踪订阅状态；</li></ol></section><section><h3>终端：</h3><p>仅限于 <strong>安卓</strong>/<strong>鸿蒙</strong> 系统的小程序</p></section>","change:c-subscription-renewal:canceled":"<section class=\"requirement-section\"><h3>会员卡片</h3><ul class=\"requirement-list\"><li>用户昵称</li><li>会员类型 · 已取消自动续费</li><li>用户 ID</li></ul></section><section class=\"requirement-section\"><h3>权益到期信息</h3><ul class=\"requirement-list\"><li>会员状态：已取消自动续费</li><li>权益到期：计算规则如下：</li><ul><li>以服务端返回的当前有效权益到期时间为准</li><li style=\"margin: 0px 0px 7px; padding-left: 2px;\">权益到期时间以最近一次已支付成功并生效的会员商品为计算基础</li></ul></ul></section><section class=\"requirement-section\"><h3>续费开关</h3><ul class=\"requirement-list\"><li>默认展示为关闭状态，文案为“自动续费”</li><li>用户点击开关后，跳转至付费页</li></ul></section>","change:c-subscription-renewal:expired":"<section class=\"requirement-section\"><h3>续费开关</h3><ul class=\"requirement-list\"><li>默认展示为关闭状态，文案为“再次续费”。</li><li>用户点击开关后，跳转至付费页。</li><li>用户完成新的会员商品购买后，重新建立对应的会员状态。</li></ul></section>","change:c-virtual-payment":"<section class=\"requirement-section\"><h3>支付方式更新</h3><p>将目前的<strong>微信支付委托代扣</strong>更改为接入<strong>微信小程序虚拟支付</strong>。</p><ul class=\"requirement-list\"><li>移除原委托代扣的支付链路，后续由服务端创建虚拟支付订单并调用微信虚拟支付能力。</li><li>具体接入规则、接口参数和限制以<a href=\"https://developers.weixin.qq.com/miniprogram/dev/platform-capabilities/business-capabilities/vips.html\" target=\"_blank\" rel=\"noopener noreferrer\">微信小程序虚拟支付官方文档</a>为准。</li><li>可同时参考<a href=\"https://pay.wechatpay.cn/doc/v3/merchant/4012286301\" target=\"_blank\" rel=\"noopener noreferrer\">微信支付官方签约流程文档</a>，确认支付、签约和结果返回的处理方式。</li></ul></section><section class=\"requirement-section\"><h3>前端表现</h3><ol class=\"requirement-list\"><li>页面继续保留商品选择和购买入口，但购买行为改为发起微信虚拟支付。</li><li>前端流程简单展示为：选择商品 → 点击购买 → 拉起微信虚拟支付/签约界面 → 用户确认 → 返回小程序 → 展示支付结果。</li><li>用户完成微信页面操作后，前端根据服务端最终订单结果展示“支付成功”“支付失败”或“处理中”，不能只根据客户端回调直接判定权益已生效。</li></ol><figure class=\"requirements-figure\"><img src=\"assets/virtual-payment-signing.png\" alt=\"微信官方虚拟支付开通及签约示例界面\"><figcaption>微信官方示例图：虚拟支付签约流程 <a href=\"https://developers.weixin.qq.com/miniprogram/dev/platform-capabilities/business-capabilities/vips.html\" target=\"_blank\" rel=\"noopener noreferrer\">参考官方文档</a></figcaption></figure></section>"},"updatedAt":"2026-10-09T21:33:43.110Z"};

function requirementTableGrid(table){const grid=[],positions=new Map();[...table.rows].forEach((row,r)=>{grid[r]||=[];let column=0;[...row.cells].forEach(cell=>{while(grid[r][column])column++;positions.set(cell,column);for(let y=r;y<r+cell.rowSpan;y++){grid[y]||=[];for(let x=column;x<column+cell.colSpan;x++)grid[y][x]=cell}column+=cell.colSpan})});return {grid,positions,width:Math.max(0,...grid.map(row=>row.length))}}
function changeRequirementTable(action){
  const content=editableRequirementContent(),cell=selectedTableCell(),table=cell?.closest('table');
  if(!content||!table){showToast('请先将光标放入表格单元格');return}
  const row=cell.parentElement,rows=[...table.rows],rowIndex=rows.indexOf(row),layout=requirementTableGrid(table),column=layout.positions.get(cell);
  if(action==='add-row'){
    const next=document.createElement('tr');
    const occupied=new Set();
    layout.grid[rowIndex+1]?.forEach((source,index)=>{if(source&&rows.indexOf(source.parentElement)<=rowIndex&&rows.indexOf(source.parentElement)+source.rowSpan>rowIndex+1){occupied.add(index);source.rowSpan++}});
    for(let index=0;index<layout.width;index++)if(!occupied.has(index)){const part=document.createElement(row.parentElement.tagName==='THEAD'?'th':'td');part.textContent='内容';next.append(part)}
    row.after(next);
  }else if(action==='delete-row'){
    if(row.parentElement.rows.length<=1){showToast('表格至少保留一行');return}
    row.remove();
  }else if(action==='add-column'){
    rows.forEach(current=>{const part=document.createElement(current.parentElement.tagName==='THEAD'?'th':'td');part.textContent=part.tagName==='TH'?'列标题':'内容';const following=[...current.cells].find(existing=>layout.positions.get(existing)>column);current.insertBefore(part,following||null)});
  }else if(action==='delete-column'){
    if(layout.width<=1){showToast('表格至少保留一列');return}
    const affected=new Set(layout.grid.map(cells=>cells[column]).filter(Boolean));
    affected.forEach(target=>{if(target.colSpan>1)target.colSpan--;else target.remove()});
  }
}

  if(key==='change:c-subscription-renewal'&&(activeState.id==='canceled'||activeState.id==='expired'))stateContent=stateContent.replace(/用户点击开关后，(?:跳转至付费页|触发复购弹窗；点击“重新开通”进入当前商品购买流程，点击“查看所有套餐”进入全屏付费页)/g,'用户点击开关后，触发 <span class="renewal-modal-anchor">复购弹窗</span>；点击“重新开通”进入当前商品购买流程，点击“查看所有套餐”进入全屏付费页');
  const commonContent=commonHtml?`<div class="requirement-common-heading">通用页面需求</div><div class="requirement-common-content">${commonHtml}</div>`:'';
  const renewalTabs=key==='change:c-subscription-renewal'?`<nav class="requirement-state-tabs renewal-requirement-state-tabs"><div class="renewal-state-group">${req.states.map(item=>`<button class="${item.id===activeState.id?'active':''}" data-requirement-state="${item.id}">${escape(item.name)}</button>`).join('')}</div><i class="renewal-state-divider">｜</i><div class="renewal-state-group"><button class="${state.renewalTier==='vip'?'active':''}" data-renewal-tier="vip">VIP</button><button class="${state.renewalTier==='svip'?'active':''}" data-renewal-tier="svip">SVIP</button></div></nav>`:`<nav class="requirement-state-tabs">${req.states.map(item=>`<button class="${item.id===activeState.id?'active':''}" data-requirement-state="${item.id}">${escape(item.name)}</button>`).join('')}</nav>`;
  const editor=`<div class="requirements-editor" data-requirement-key="${escape(stateKey)}"><div class="requirements-editor-toolbar"><button type="button" data-editor-action="edit">编辑</button><button type="button" data-editor-action="bold">加粗</button><button type="button" data-editor-action="highlight">高亮</button><button type="button" data-editor-action="row-highlight">高亮表格行</button><small data-editor-status>只读</small><button type="button" class="save" data-editor-action="save">保存</button></div>${renewalTabs}<article class="requirements-note requirements-editor-content" contenteditable="false"><div class="requirement-state-content">${stateContent}</div>${commonContent}</article></div>`;
  if(key==='change:c-subscription-mine'&&activeState.id.includes('renewing')){
    const info=mineStateCatalog.find(item=>item.id===activeState.id)||mineStateInfo();
    stateContent=stateContent.replace(/主按钮：更高权益/g,'主按钮：<span class="mine-upgrade-modal-anchor">更高权益</span>');
    const updatedEditor=editor.replace(`<div class="requirement-state-content">${stateHtml}</div>`,`<div class="requirement-state-content">${stateContent}</div>`);
    return `<div class="mine-requirements-layout">${updatedEditor}${mineUpgradeModalRequirement(info)}</div>`;
  }
  return key==='change:c-subscription-renewal'?`<div class="renewal-requirements-layout">${editor}${renewalModalRequirement()}</div>`:editor;
};

/* 我的页会员卡交互：卡片/管理入口进入续费管理，主按钮进入付费流程。 */
function mineRenewalState(info){return info.status==='续费中'?'active':info.status==='已取消'?'canceled':'expired'}
function openMineRenewal(){
  const info=mineStateInfo();
  if(info.type==='Free')return openAction('join');
  state.pageId='renewal';
  state.stateId=mineRenewalState(info);
  state.renewalTier=info.type==='SVIP'?'svip':'vip';
  state.renewalProduct=info.product==='连续包年'?'annual':'monthly';
  state.noteMode='page';
  state.pageNoteRequested=true;
  state.activeAnnotation=null;
  renderAll();
}
function openMinePayment(){
  const info=mineStateInfo();
  state.pageId='payment';
  state.stateId='default';
  state.paymentTab=info.type==='SVIP'?'svip':'vip';
  state.paymentPlan=info.product==='连续包年'?'annual':'monthly';
  state.paymentPlanScrollLeft=0;
  state.paymentAgreed=false;
  state.noteMode='page';
  state.pageNoteRequested=true;
  state.activeAnnotation=null;
  renderAll();
}
function openAction(target){
  if(state.pageId==='payment'&&state.stateId==='lifetime-svip'&&target==='payment-submit')return;
  if(target==='manage'){
    if(state.pageId==='mine')return openMineRenewal();
    if(state.pageId==='member'&&state.stateId==='member'){state.pageId='renewal';state.stateId='active';state.noteMode='page';state.pageNoteRequested=true;renderAll();return}
  }
  if(target==='join'&&state.pageId==='mine')return openMinePrimaryModal();
  if(target==='payment-submit'&&isRecurringPlan()&&!state.paymentAgreed){showPaymentAgreementSheet();return}
  if(target==='join'&&state.platform!=='ios'){state.pageId='payment';state.stateId='default';state.noteMode='page';state.activeAnnotation=null;renderAll();return}
  const a=annotation(target);if(!a)return;
  clearTextSelection();
  if(target!=='payment-submit'){state.noteMode='annotation';state.activeAnnotation=a;renderNotes()}
  state.sheetAction=target;document.querySelector('.sheet-actions')?.classList.remove('single');$('#sheetTitle').textContent=a.title;$('#sheetText').textContent=a.action;$('#confirm').textContent='确认';$('#cancel').textContent='取消';$('#mask').classList.add('show');$('#sheet').classList.add('show')
}
function minePrimaryModalHtml(info){
  const isUpgrade=info.status==='续费中',isExpired=info.status==='已过期',tier=info.type,product=info.product||(info.card==='单次卡'?'单次商品':'连续包月');
  const targetProduct=isUpgrade?(info.type==='VIP'?product:'终身会员'):product;
  const price=isUpgrade?(info.type==='VIP'?(product==='连续包年'?'¥128 / 年':'¥28 / 月'):'¥298'):(tier==='SVIP'?(product==='连续包年'?'¥128 / 年':'¥28 / 月'):(product==='连续包年'?'¥88 / 年':'¥18 / 月'));
  const kicker=isUpgrade?'为你推荐':isExpired?'欢迎再次回来':'让会员时光继续';
  const heading=isUpgrade?(info.type==='VIP'?'升级至 SVIP':'升级为终身会员'):isExpired?'重新开通会员':'继续使用会员权益';
  const targetLabel=info.type==='VIP'?`SVIP · ${targetProduct}`:'SVIP · 终身会员';
  const copy=isUpgrade?(info.type==='VIP'?'当前 VIP 可升级为 SVIP，解锁更多高级权益。':'升级为终身会员，一次购买，长期享有 SVIP 权益。'):isExpired?'您的会员权益已失效，重新开通后即可继续享受会员服务。':'您的会员权益将于 2026年10月21日过期，重新开通后即可继续享受会员服务。';
  const action=isUpgrade?(info.type==='VIP'?`升级至 SVIP · ${targetProduct}`:'升级为终身会员'):`重新开通 ${tier} · ${product}`;
  const productBody=isUpgrade?`<div class="upgrade-path" aria-label="会员升级路径"><div class="upgrade-node upgrade-current"><small>当前会员</small><b>${tier}</b></div><div class="upgrade-arrow" aria-hidden="true"><span>升级</span></div><div class="upgrade-node upgrade-target"><small>推荐升级</small><b>${targetLabel}</b><em>${price}</em></div></div><div class="upgrade-benefit"><strong>更高权益</strong><span>${targetProduct==='终身会员'?'一次购买，长期有效':'升级后立即享受 SVIP 专属权益'}</span></div>`:`<section class="repurchase-product"><div class="repurchase-product-main"><i class="repurchase-product-mark">${tier}</i><div><b>${tier} · ${product}</b><small>${isExpired?'上次购买商品':'当前商品'} · ${price}</small></div></div><div class="repurchase-price"><strong>${price.split(' ')[0]}</strong><small>${price.includes('年')?'每年':price.includes('月')?'每月':'一次购买'}</small></div></section>`;
  return `<section class="repurchase-layer" data-repurchase-layer data-modal-kind="${isUpgrade?'upgrade':'repurchase'}"><article class="repurchase-modal ${isUpgrade?'upgrade-modal':''}" role="dialog" aria-modal="true" aria-label="${heading}"><div class="repurchase-modal-head"><div><p class="repurchase-modal-kicker">${kicker}</p><h2>${heading}</h2></div><button class="repurchase-close" type="button" data-repurchase-close aria-label="关闭">×</button></div><p class="repurchase-modal-copy">${copy}</p>${productBody}<div class="repurchase-modal-actions"><button class="repurchase-primary" type="button" data-repurchase-buy>${action}</button><button class="repurchase-secondary" type="button" data-repurchase-all>查看所有套餐</button></div></article></section>`;
}
function mineHtmlByStatus(){
  const info=mineStateInfo();
  if(info.type==='Free')return mineHtml();
  const product=info.product||(info.card==='单次卡'?'单次商品':'连续包月');
  const statusClass=info.status==='已取消'?'status-canceled':info.status==='已过期'?'status-expired':'status-renewing';
  const status=info.status==='续费中'?'续费中':info.status==='已取消'?'已取消自动续费':'已过期';
  const subtitle=info.status==='续费中'?'下次扣款日期：2026年10月21日':info.status==='已取消'?'权益有效至：2026年10月21日':'会员权益已过期';
  const footnote=info.status==='续费中'?'可随时取消自动续费':info.status==='已取消'?'当前权益仍可使用，到期后不会再扣费':'重新购买后即可恢复会员权益';
  const primary=info.status==='续费中'?(info.type==='VIP'?'更高权益':'终身权益'):info.status==='已取消'?'恢复续费':'恢复权益';
  return `<!-- 三种订阅状态共用同一张会员卡：卡片/管理入口进入续费管理，主按钮按状态进入复购或升级弹窗。 --><article class="mine-screen" aria-label="我的页面"><header class="mine-status"><b>3:51</b><span>☾　▮▮▮　⌁　▭</span></header><div class="mine-title"><h1>我的</h1><div class="mine-more">•••　│　◉</div></div><section class="mine-user"><div class="mine-avatar">●</div><strong>加画框用户</strong><b class="mine-vip-badge">${info.type}</b><span>ID: 6787677</span></section><section class="mine-vip-card ${statusClass}" data-target="manage" role="button" tabindex="0" aria-label="查看${info.type}会员${status}"><div class="mine-card-copy"><div class="mine-card-head"><span class="mine-card-status">${status}</span><span class="mine-card-plan">${product}</span></div><h2>${info.type}会员</h2><p>${subtitle}</p><small class="mine-card-footnote">${footnote}</small></div><div class="mine-card-actions"><button class="mine-card-primary" data-target="join">${primary}</button><button class="mine-card-secondary" data-target="manage">续费管理 <span>›</span></button></div></section><section class="mine-menu-group mine-two"><button class="mine-row" data-target="works"><i class="mine-icon works"></i><b>我的作品</b><span>0个作品</span><em>›</em></button><button class="mine-row" data-target="favorites"><i class="mine-icon heart">♡</i><b>我的收藏</b><span>0个收藏</span><em>›</em></button></section><section class="mine-menu-group mine-four"><button class="mine-row" data-target="settings"><i class="mine-icon">⚙</i><b>设置</b><span>账户管理</span><em>›</em></button><button class="mine-row" data-target="desktop"><i class="mine-icon desktop"></i><b>电脑版</b><span>www.jiahk.cn</span><em>›</em></button><button class="mine-row" data-target="wechat"><i class="mine-icon">◉</i><b>官方微信</b><span>进交流群</span><em>›</em></button><button class="mine-row" data-target="service"><i class="mine-icon headset">♧</i><b>在线客服</b><span>10:00-20:00</span><em>›</em></button></section><button class="mine-recommend" data-target="recommend"><i class="mine-icon">♧</i><b>推荐加画框</b><em>›</em></button>${minePrimaryModalHtml(info)}</article>`;
}
const renderPhoneWithMineActions=renderPhone;
renderPhone=function(){
  renderPhoneWithMineActions();
  if(state.pageId==='mine'){
    const info=mineStateInfo(),card=document.querySelector('.mine-vip-card'),title=card?.querySelector('h2');
    if(title&&info.type!=='Free'){
      const product=info.product||(info.card==='单次卡'?'单次商品':'连续包月');
      title.textContent='';
      const tier=document.createElement('span');tier.className='mine-card-tier';tier.textContent=`${info.type}会员`;
      const plan=document.createElement('span');plan.className='mine-card-plan-title';plan.textContent=` · ${product}`;
      title.append(tier,plan);
    }
    const copy=card?.querySelector('.mine-card-copy'),date=copy?.querySelector('p'),manage=card?.querySelector('.mine-card-secondary');
    if(copy&&date&&manage){
      const row=document.createElement('div');row.className='mine-card-detail-row';
      date.replaceWith(row);row.append(date,manage);
    }
  }
  document.querySelectorAll('[data-target]').forEach(button=>button.onclick=event=>{event.stopPropagation();openAction(button.dataset.target)});
}

$('#treeSwitch').onclick=()=>{state.tree=state.tree==='release'?'page':'release';state.selectedChange=null;state.noteMode='page';state.pageNoteRequested=state.tree==='page';state.activeAnnotation=null;renderAll()};$('#fullNote').onclick=()=>{state.noteMode='page';state.pageNoteRequested=true;state.activeAnnotation=null;state.selectedChange=null;renderAll()};$('#cancel').onclick=closeSheet;$('#agreementClose').onclick=closeSheet;$('#mask').onclick=closeSheet;$('#confirm').onclick=confirmAction;
loadRequirements().catch(error=>{savedRequirements={};requirementsLoadError=error?.message||'无法读取需求数据'}).finally(()=>{loadWorkspaceStructure();renderAll()});
// 线上唯一数据源：Vercel API 读取 Supabase；不再维护离线 JS 数据副本。
async function loadRequirements(){const response=await fetch('/api/requirements',{cache:'no-store'});if(!response.ok)throw new Error('无法读取线上需求数据');const payload=await response.json();savedRequirements=payload.requirements||{};requirementsLoadSucceeded=true}
