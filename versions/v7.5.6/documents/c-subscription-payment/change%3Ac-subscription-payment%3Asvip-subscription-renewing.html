<section class="requirement-section"><h3>SVIP 连续会员 · 续费中</h3><p>付费页展示可购买套餐。以下购买按钮上方提示适用于原订阅签约平台为安卓/鸿蒙的用户：</p><ul class="requirement-list"><li>购买 SVIP 单次卡：购买后将自动关闭已有的续费套餐，已付会员天数保留。</li><li>购买 SVIP 终身会员：购买后将自动关闭已有的续费套餐。</li></ul><p>购买 VIP 单次卡或终身会员保留原续费，不展示上述提示；同级或低等级连续商品不可购买。Free 状态不展示提示。</p></section>
