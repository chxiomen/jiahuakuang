<section class="requirement-section"><h3>会员卡片</h3><ul class="requirement-list"><li>用户昵称</li><li>会员类型 · 已取消自动续费</li><li>用户 ID</li></ul></section><section class="requirement-section"><h3>权益到期信息</h3><ul class="requirement-list"><li>会员状态：已取消自动续费</li><li>权益到期：计算规则如下：</li><ul><li>以服务端返回的当前有效权益到期时间为准</li><li style="margin: 0px 0px 7px; padding-left: 2px;">权益到期时间以最近一次已支付成功并生效的会员商品为计算基础</li></ul></ul></section><section class="requirement-section"><h3>续费开关</h3><ul class="requirement-list"><li>默认展示为关闭状态，文案为“自动续费”</li><li>用户点击开关后，跳转至付费页</li></ul></section><section class="requirement-section"><h3>iOS 状态</h3><ul class="requirement-list"><li>不展示续费开关；展示当前会员权益到期时间，已取消的订阅不再自动续费。</li><li>底部保留《自动续费协议》入口。</li></ul></section>
