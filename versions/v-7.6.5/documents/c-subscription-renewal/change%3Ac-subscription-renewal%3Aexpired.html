<section class="requirement-section"><h3>会员卡片</h3><ul class="requirement-list"><li>用户昵称</li><li>会员类型 · 已到期</li><li>用户 ID</li></ul></section><section class="requirement-section"><h3>续费开关</h3><ul class="requirement-list"><li>默认展示为关闭状态，文案为“再次续费”。</li><li>用户点击开关后，跳转至付费页。</li><li>用户完成新的会员商品购买后，重新建立对应的会员状态。</li></ul></section><section class="requirement-section"><h3>iOS 状态</h3><ul class="requirement-list"><li>不展示续费开关；会员权益已到期，页面展示已到期状态。</li><li>底部保留《自动续费协议》入口。</li></ul></section>
